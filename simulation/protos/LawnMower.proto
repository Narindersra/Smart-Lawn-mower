#VRML_SIM R2025a utf8

PROTO LawnMower [
  field SFVec3f    translation 0 0 0.1
  field SFRotation rotation    0 0 1 0
  field SFString   name        "LawnMower"
  field SFString   controller  "mower_webots_controller"
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    children [
      # Main Robot Body Chassis (Blue Box)
      Pose {
        translation 0 0 0.05
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0 0.4 0.8
              roughness 0.5
            }
            geometry Box {
              size 0.5 0.4 0.15
            }
          }
        ]
      }
      # Left Drive Wheel
      HingeJoint {
        jointParameters HingeJointParameters {
          anchor 0.1 0.22 0.05
          axis 0 1 0
        }
        device [
            RotationalMotor {
              name "left_wheel_motor"
            }
            PositionSensor {
              name "left_wheel_encoder"
            }
        ]
        endPoint Solid {
          name "left_wheel"
          translation 0.1 0.22 0.05
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.1 0.1 0.1 }
              geometry Cylinder { height 0.04 radius 0.08 }
            }
          ]
          boundingObject Cylinder { height 0.04 radius 0.08 }
          physics Physics {}
        }
      }
      # Right Drive Wheel
      HingeJoint {
        jointParameters HingeJointParameters {
          anchor 0.1 -0.22 0.05
          axis 0 1 0
        }
        device [
          RotationalMotor {
            name "right_wheel_motor"
          }
          PositionSensor {
            name "right_wheel_encoder"
          }
        ]
        endPoint Solid {
          name "right_wheel"
          translation 0.1 -0.22 0.05
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.1 0.1 0.1 }
              geometry Cylinder { height 0.04 radius 0.08 }
            }
          ]
          boundingObject Cylinder { height 0.04 radius 0.08 }
          physics Physics {}
        }
      }
      # Rear Caster Wheel (Balance Support)
      Pose {
        translation -0.2 0 0.01
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.2 0.2 0.2 }
            geometry Sphere { radius 0.04 }
          }
        ]
      }
      # Ultrasonic Distance Sensor (Front Bumper)
      DistanceSensor {
        translation 0.26 0 0.08
        rotation 0 0 1 0
        name "ds_front"
        lookupTable [ 0 0 0, 2 2000 0 ]
      }
      # AI Vision Camera Sensor (Front Center)
      Camera {
        translation 0.25 0 0.12
        rotation 0 0 1 0
        name "camera"
        width 640
        height 480
      }
      InertialUnit {
        translation 0 0 0.12
        name "imu"
      }
      GPS {
        translation 0 0 0.12
        name "gps"
      }
    ]
    # Physics Collision Box
    boundingObject Pose {
      translation 0 0 0.05
      children [
        Box { size 0.5 0.4 0.15 }
      ]
    }
    physics Physics {
      density -1
      mass 10
    }
  }
}